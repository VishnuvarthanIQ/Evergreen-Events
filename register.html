<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corporate Client Registration | Evergreen Events</title>
  <meta name="description" content="Register your organization for the Evergreen Events Client Portal. Track event itineraries, vendor contracts, and live RSVPs.">
  <link rel="icon" href="assets/img/favicon/favicon.svg" type="image/svg+xml">
  <script src="assets/js/theme.js"></script>
  <link id="bs" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Minimal Auth Topbar (Sticky) -->
  <header class="auth-topbar sticky-top">
    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="btn btn-sm btn-ghost" data-theme-toggle title="Toggle Dark/Light Mode" aria-label="Toggle theme">◐</button>
      <button class="btn btn-sm btn-ghost" data-dir-toggle title="Toggle RTL/LTR Layout" aria-label="Toggle text direction">⇄</button>
    </div>
  </header>

  <!-- Register Main Content with Unique Hero Background Image -->
  <main class="flex-grow-1 d-flex align-items-center py-5 position-relative cover-page-hero">
    <div class="cover-page-bg" style="background-image: url('assets/img/hero-register.jpg');"></div>
    <div class="cover-page-overlay"></div>
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
          <div class="card p-4 p-md-5 shadow-lg border-warning border-opacity-25">
            <div class="text-center mb-4">
              <div class="mb-3">
                <a href="index.html" class="auth-brand-link" title="Back to Evergreen Events Homepage">
                  <img src="assets/img/favicon/logo.svg" alt="Evergreen Events Logo" width="38" height="38" class="site-logo flex-shrink-0">
                  <span class="brand">Evergreen Events</span>
                </a>
              </div>
              <span class="badge badge-gold mb-2">New Corporate Client</span>
              <h2 class="font-serif mb-1">Create Client Account</h2>
              <p class="small text-muted mb-0">Join hundreds of corporate leaders who trust Evergreen for effortless event execution.</p>
            </div>

            <form data-validate novalidate data-action="register" class="row g-3">
              <!-- Full Name -->
              <div class="col-md-12">
                <label class="form-label small fw-semibold" for="regName">Full Name <span class="text-danger">*</span></label>
                <input id="regName" type="text" class="form-control" data-rule="name" placeholder="E.g. Priya Sharma" pattern="^[A-Za-z\s.'-]{2,}$" title="Name must contain letters, spaces, hyphens, or apostrophes only (no numbers)." required>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Work Email -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="regEmail">Work Email Address <span class="text-danger">*</span></label>
                <input id="regEmail" type="email" class="form-control" data-rule="email" placeholder="name@company.com" required>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Phone (10 Digits) -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="regPhone">Mobile Number (10 Digits) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted small">+91</span>
                  <input id="regPhone" type="tel" class="form-control" data-rule="phone" placeholder="9876543210" required>
                </div>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Password -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="regPass">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input id="regPass" type="password" class="form-control" data-rule="pass" placeholder="Min. 8 chars (letters & numbers)" required>
                  <button type="button" class="btn btn-ghost" data-pw="regPass" aria-label="Toggle password visibility">Show</button>
                </div>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Confirm Password -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold" for="regConfirm">Confirm Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input id="regConfirm" type="password" class="form-control" data-rule="confirm" placeholder="Re-type password" required>
                  <button type="button" class="btn btn-ghost" data-pw="regConfirm" aria-label="Toggle password visibility">Show</button>
                </div>
                <div class="invalid-feedback"></div>
              </div>

              <!-- Terms Checkbox -->
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terms" data-rule="terms" required>
                  <label class="form-check-label small text-muted" for="terms">
                    I agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and corporate NDA.
                  </label>
                  <div class="invalid-feedback"></div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-gold btn-lg w-100 mb-2">Create Account</button>
                <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 auth-guest-btn" id="guestRegisterBtn" title="Instant Guest Access">
                  <span>👤</span>
                  <span class="fw-semibold">Continue as Guest</span>
                </button>
              </div>

              <!-- Social Divider -->
              <div class="col-12 my-2">
                <div class="d-flex align-items-center">
                  <hr class="flex-grow-1 my-0 opacity-25">
                  <span class="px-3 small text-muted">or continue with</span>
                  <hr class="flex-grow-1 my-0 opacity-25">
                </div>
              </div>

              <!-- Social Auth Buttons -->
              <div class="col-6">
                <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 auth-social-btn" data-social="Google" aria-label="Sign up with Google">
                  <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                  <span class="small fw-semibold">Google</span>
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 auth-social-btn" data-social="Apple" aria-label="Sign up with Apple">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.42c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.62 1.35-.57.65-1.07 1.71-.93 2.73 1 .08 2.01-.48 2.62-1.23z"/></svg>
                  <span class="small fw-semibold">Apple</span>
                </button>
              </div>

              <div class="col-12 mt-3">
                <p class="small text-muted text-center mb-0">
                  Already registered? <a href="login.html" class="fw-semibold">Sign in here</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small text-muted">
    <div>© 2026 Evergreen Events Planning Ltd. Secure Client Portal.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/validation.js"></script>
  <script>
    var guestRegBtn = document.getElementById('guestRegisterBtn');
    if (guestRegBtn) {
      guestRegBtn.addEventListener('click', function(e) {
        e.preventDefault();
        var guestUser = {
          name: 'Guest',
          email: 'guest@evergreen-events.example',
          isGuest: true
        };
        try {
          localStorage.setItem('eg_logged_user', JSON.stringify(guestUser));
          sessionStorage.setItem('eg_current_user', JSON.stringify(guestUser));
        } catch (err) {}

        if (typeof window.updateAuthHeader === 'function') {
          window.updateAuthHeader();
        }
        window.dispatchEvent(new CustomEvent('authChange', { detail: guestUser }));

        window.popup('Guest Access', 'Signed in as Guest! Welcome to Evergreen Events.', true);
      });
    }
  </script>
</body>
</html>
